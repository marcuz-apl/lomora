[package]
name = "lomora"
version = "0.1.8"
edition = "2024"
# Required since src/bin/mock_upstream.rs exists: without it `cargo run` refuses to guess
# between the `lomora` and `mock_upstream` binaries, and plain `cargo run` should start the server.
default-run = "lomora"

[lib]
name = "lomora"
path = "src/lib.rs"

[[bin]]
name = "lomora"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
tower-http = { version = "0.7.1", features = ["cors"] }
# `hooks` is only here for `Connection::progress_handler`, which gives the raw-SQL console its
# interrupt budget (store.rs). It pulls `wal` and no new crates: the symbols are already in
# libsqlite3-sys, which the `bundled` backend compiles.
rusqlite = { version = "0.41.1", features = ["bundled", "hooks"] }
sysinfo = "0.40.1"
nvml-wrapper = "0.13.0"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order is load-bearing: without it serde_json sorts object keys alphabetically,
# so `json!` bodies (error.rs) would silently disagree with the documented key order.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
futures-util = "0.3.34"
mime_guess = "2.0.5"
anyhow = "1"
# Only `to_rfc3339()` (store.rs `created_at`) and `format("%H:%M:%S")`. No `serde` feature:
# nothing serializes a chrono value — every timestamp leaves the crate as a string that is
# formatted before it reaches SQL or JSON.
chrono = "0.4.45"
# Decompresses HumanEval's `HumanEval.jsonl.gz` (the prompt fetcher's coding source) and nothing
# else. The default `miniz_oxide` backend keeps it pure Rust, no C toolchain.
flate2 = "1"

[target.'cfg(windows)'.dependencies]
# The launch console policy in src/console.rs (`GetConsoleProcessList`, `ShowWindow`) and the
# notification-area icon in src/tray.rs (`Shell_NotifyIconW`, a GDI-drawn icon, a popup menu, and
# `ShellExecuteW` to open the dashboard). The crate is already in the tree (sysinfo depends on it),
# so this adds no download - only the feature gates those calls sit behind.
windows = { version = "0.62", features = [
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(unix)'.dependencies]
# One call, `setsid`, for the `--hidden` re-exec in src/console.rs. Also already in the tree (tokio
# and the TLS stack pull it), so this is a feature-free addition.
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
