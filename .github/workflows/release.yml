name: Release

# A tag push is the release trigger: the tag names the version, the crate version must agree,
# and every platform is built, tested and published from that one commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform reports its own result: with fail-fast, one red job cancels the
      # others mid-build and their "failure" says nothing about their code.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: lomora-windows-x86_64.exe
            binary: target/release/lomora.exe
          # Pinned, not `ubuntu-latest`: the runner's glibc becomes the binary's floor. Built on
          # 24.04 the asset required GLIBC_2.38/2.39 and died in the loader on Ubuntu 22.04,
          # Debian 12 and RHEL 9. 22.04 keeps the floor at 2.35, and the binary only needs libc,
          # libm and libgcc_s (NVML is dlopen'd at runtime), so nothing else is dragged along.
          - os: ubuntu-22.04
            asset: lomora-linux-x86_64
            binary: target/release/lomora
          - os: macos-latest
            asset: lomora-macos-aarch64
            binary: target/release/lomora
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The release asset is only trustworthy if its version is the tag's version, so a
      # forgotten Cargo.toml bump fails here instead of publishing a mislabelled binary.
      - name: Tag must match the crate version
        shell: bash
        run: |
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "v$crate" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate" >&2
            exit 1
          fi

      # The suite is deterministic on every runner: tests use `NoGpu`, and NVML is loaded at
      # runtime, so a machine without an NVIDIA driver still passes.
      - name: Test
        run: cargo test --all-targets

      - name: Build
        run: cargo build --release

      # `--hidden` on Unix is a real feature, not a no-op: the launcher re-execs a detached
      # child, waits for the port, reports, and exits. Only a smoke against the release binary
      # proves the child outlives the parent and keeps serving.
      - name: The hidden launcher detaches and leaves a server behind
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export PORT=18501 LOMORA_DB="$RUNNER_TEMP/lomora-ci.db"
          ./target/release/lomora --hidden | tee launch.txt
          grep -q "listening" launch.txt
          curl --retry 20 --retry-connrefused --retry-delay 1 -fsS "http://127.0.0.1:$PORT/api/version"
          kill "$(cat "$RUNNER_TEMP/lomora.pid")"

      - name: Stage the binary under its release name
        shell: bash
        run: cp "${{ matrix.binary }}" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `merge-multiple` flattens the three artifacts into one folder, which is what the
      # release upload expects.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The installers and the npm postinstall verify downloads against this file.
      # Generate it here, from the exact artifacts being published, not from the
      # per-platform build jobs, so the sums can never drift from the assets.
      - name: Generate SHA256SUMS
        shell: bash
        working-directory: dist
        run: |
          sha256sum lomora-* > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            One self-contained binary per platform: the dashboard, the API, and the SQLite store are embedded, so there is nothing else to install. Run it and open http://localhost:8501.

            | Platform | Asset |
            |---|---|
            | Windows x86_64 | `lomora-windows-x86_64.exe` |
            | Linux x86_64 | `lomora-linux-x86_64` |
            | macOS (Apple Silicon) | `lomora-macos-aarch64` |
            | Checksums | `SHA256SUMS` |

            Install from a terminal:

            ```bash
            # Linux / macOS
            curl -fsSL https://raw.githubusercontent.com/marcuz-apl/lomora/master/install.sh | sh
            # Windows (PowerShell)
            irm https://raw.githubusercontent.com/marcuz-apl/lomora/master/install.ps1 | iex
            # Or with Node.js
            npm install -g lomora
            ```

            - Run the binary from a folder of its own: the database is created at `data/lomora.db` beside the working directory. `PORT` and `LOMORA_DB` override the defaults.
            - The binaries are unsigned. On Windows, SmartScreen shows "unknown publisher" once; choose *More info* then *Run anyway*. On macOS, right-click the binary and choose *Open* the first time, or run `chmod +x` and start it from a terminal.
            - GPU metrics need an NVIDIA driver exposing NVML (`nvml.dll` on Windows, `libnvidia-ml.so` on Linux). Machines without one, including Apple Silicon Macs, report CPU and RAM only, and the dashboard explains why and links the Windows/Linux driver download when a card is present.

  publish-npm:
    name: Publish to npm
    # Publishing is optional for the release: without a configured NPM_TOKEN the
    # job is a no-op and the GitHub release still ships all three binaries.
    needs: publish
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: env.NPM_TOKEN != ''
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # The tag is the source of truth for the version (the build job already
      # checks it against Cargo.toml), so npm can never advertise a different
      # release than the binary its postinstall downloads.
      - name: Sync the package version with the tag
        if: env.NPM_TOKEN != ''
        working-directory: npm
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Publish the launcher package
        if: env.NPM_TOKEN != ''
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm pack --dry-run
          npm publish --access public
